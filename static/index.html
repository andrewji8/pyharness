<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyHarness Web UI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <h1>PyHarness</h1>
            </div>
            <div class="header-right">
                <button id="btn-new-session" class="btn btn-primary">新建会话</button>
                <button id="btn-search" class="btn btn-secondary">搜索</button>
            </div>
        </header>

        <!-- 主体三栏布局 -->
        <main class="main">
            <!-- 左侧：会话列表 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>会话列表</h2>
                </div>
                <div class="session-list" id="session-list">
                    <div class="loading">加载中...</div>
                </div>
            </aside>

            <!-- 中间：对话流 -->
            <section class="chat-area">
                <div class="chat-header" id="chat-header">
                    <span>选择一个会话或开始新对话</span>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="welcome">
                        <h2>👋 欢迎使用 PyHarness</h2>
                        <p>发送消息开始与 Agent 对话</p>
                    </div>
                </div>
                <div class="chat-input-area">
                    <textarea id="user-input" placeholder="输入消息..." rows="1"></textarea>
                    <button id="btn-send" class="btn btn-primary">发送</button>
                </div>
            </section>

            <!-- 右侧：Plan 进度 + Subagent 状态 -->
            <aside class="right-panel">
                <!-- Plan 进度 -->
                <div class="plan-panel" id="plan-panel">
                    <h3>Plan 进度</h3>
                    <div class="plan-empty" id="plan-empty">
                        <p>暂无执行计划</p>
                    </div>
                    <div class="plan-content" id="plan-content" style="display:none;">
                        <div class="plan-progress-bar">
                            <div class="plan-progress-fill" id="plan-progress-fill"></div>
                        </div>
                        <div class="plan-steps" id="plan-steps"></div>
                    </div>
                </div>

                <!-- Subagent 状态 -->
                <div class="subagent-panel" id="subagent-panel">
                    <h3>Subagent 状态</h3>
                    <div class="subagent-empty" id="subagent-empty">
                        <p>暂无活跃的子 Agent</p>
                    </div>
                    <div class="subagent-list" id="subagent-list"></div>
                </div>
            </aside>
        </main>
    </div>

    <!-- 搜索模态框 -->
    <div class="modal" id="search-modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>搜索历史会话</h3>
                <button class="modal-close" id="btn-close-search">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="search-input" placeholder="输入搜索关键词...">
                <button id="btn-do-search" class="btn btn-primary">搜索</button>
                <div class="search-results" id="search-results"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
